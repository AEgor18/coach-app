[tool.poetry]
name = "fitness-coach-app"
version = "1.0.0"
description = "API для приложения тренера"
authors = ["aegor"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
sqlalchemy = "^2.0.0"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.22"
python-dotenv = "^1.0.0"
pydantic-settings = "^2.0.0"
email-validator = "^2.0.0"
uvicorn = {extras = ["standard"], version = "^0.23.0"}
boto3 = "^1.34.0"
argon2-cffi = "^23.0.0"
tenacity = "^8.2.0"
cryptography = "^41.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
httpx = "^0.28.0"
pytest-cov = "^4.1.0"
ruff = "0.1.6"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "*.pyc",
    ".mypy_cache",
    ".pytest_cache",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/conftest.py" = ["E402"]
"backend/tests/**/conftest.py" = ["E402"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["core", "crud", "models", "schemas", "api", "tests"]
lines-after-imports = 2