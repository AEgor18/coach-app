name: CI/CD

on:
    push:
        branches: [main, master, develop]
    pull_request:
        branches: [main, master, develop]

env:
    POSTGRES_DB: coach_db
    POSTGRES_USER: coach_user
    POSTGRES_PASSWORD: coach_password

    MINIO_ROOT_USER: minioadmin
    MINIO_ROOT_PASSWORD: minioadmin123

    MINIO_ENDPOINT: http://localhost:9000
    MINIO_ACCESS_KEY: minioadmin
    MINIO_SECRET_KEY: minioadmin123
    MINIO_BUCKET_NAME: coach-photos
    MINIO_PUBLIC_URL: http://localhost:9000

    BACKEND_HOST: 0.0.0.0
    BACKEND_PORT: 8000
    DEBUG: true

jobs:
    backend-tests:
        name: Backend Tests
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: coach_db
                    POSTGRES_USER: coach_user
                    POSTGRES_PASSWORD: coach_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U coach_user"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

            minio:
                image: minio/minio:latest
                ports:
                    - 9000:9000
                    - 9001:9001
                env:
                    MINIO_ROOT_USER: minioadmin
                    MINIO_ROOT_PASSWORD: minioadmin123
                options: >-
                    --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
                command: server /data --console-address ":9001"

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.12'

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install poetry
                  cd backend
                  poetry install --no-interaction --no-root

            - name: Run backend tests
              run: |
                  cd backend
                  poetry run pytest -v

    frontend-tests:
        name: Frontend Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install dependencies
              run: |
                  cd frontend
                  npm ci

            - name: Run frontend unit tests
              run: |
                  cd frontend
                  npm run test

            - name: Build frontend
              run: |
                  cd frontend
                  npm run build

    docker-build:
        name: Docker Build Check
        runs-on: ubuntu-latest
        needs: [backend-tests, frontend-tests]

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Build containers
              run: docker compose build

    deploy:
        name: Auto Deploy
        runs-on: ubuntu-latest
        needs: docker-build
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Deploy placeholder
              run: |
                  echo "Production deploy step"
                  echo "Replace with ssh/docker pull/docker compose up -d"
